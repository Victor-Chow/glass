name: Build & Verify

on:
  push:
    branches: [ "main" ] # Runs on every push to main branch

jobs:
  build:
    # Currently runs on macOS only, can add windows-latest later
    runs-on: windows-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Node.js version compatible with project
          cache: 'npm' # npm dependency caching for speed improvement

      - name: 📦 Install root dependencies
        run: npm install

      - name: 🌐 Install and build web (Renderer) part
        # Move to pickleglass_web directory and run commands
        working-directory: ./pickleglass_web
        run: |
          npm install
          npm run build

      - name: 🔐 Install Code Signing Certificate
        if: secrets.WIN_CERT_PFX != '' && secrets.WIN_CERT_PASSWORD !=
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # Decode Base64 PFX
          $pfxBytes = [Convert]::FromBase64String($env:WIN_CERT_PFX)
          $pfxPath = Join-Path $env:TEMP "code-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          # Import to Current User certificate store
          $securePassword = ConvertTo-SecureString -String $env:WIN_CERT_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword -Exportable > $null

          # Clean up
          Remove-Item $pfxPath

          # Optional: List certificates for debugging (remove in production)
          Get-ChildItem -Path Cert:\CurrentUser\My | Where-Object { $_.Subject -like "*Glass Dev*" } | Format-List *

      - name: 🖥️ Build Electron app
        # Run Electron build script from root directory
        run: npm run build

      - name: 🚨 Send failure notification to Slack
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: general
          SLACK_TITLE: "🚨 Build Failed"
          SLACK_MESSAGE: "😭 Build failed for `${{ github.repository }}` repo on main branch."
          SLACK_COLOR: 'danger'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

