name: Build & Verify

on:
  push:
    branches: [ "main" ] # Runs on every push to main branch

jobs:
  build:
    # Currently runs on macOS only, can add windows-latest later
    runs-on: windows-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Node.js version compatible with project
          cache: 'npm' # npm dependency caching for speed improvement

      - name: 📦 Install root dependencies
        run: npm install

      - name: 🌐 Install and build web (Renderer) part
        # Move to pickleglass_web directory and run commands
        working-directory: ./pickleglass_web
        run: |
          npm install
          npm run build

      - name: 🔐 Setup Code Signing Certificate
        if: env.CSC_LINK != ''
        env:
          CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # 创建证书目录
          mkdir -p build/certs
          # 将 base64 编码的证书内容保存为文件
          echo "$CSC_LINK" | base64 -d > build/certs/glass-dev.pfx
          # 设置文件权限（仅限当前用户读写）
          chmod 600 build/certs/glass-dev.pfx
          echo "证书文件已保存到: build/certs/glass-dev.pfx"
          # 验证证书文件（可选）
          if (Get-Command "openssl" -ErrorAction SilentlyContinue) {
            echo "验证证书文件..."
            openssl pkcs12 -in build/certs/glass-dev.pfx -nokeys -passin pass:"$CSC_KEY_PASSWORD" | head -5
          }

      - name: 🖥️ Build Electron app
        env:
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        # Run Electron build script from root directory
        run: npm run build:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-installer
          path: dist/**.exe
          if-no-files-found: error

      - name: 🚨 Send failure notification to Slack
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_CHANNEL: general
          SLACK_TITLE: "🚨 Build Failed"
          SLACK_MESSAGE: "😭 Build failed for `${{ github.repository }}` repo on main branch."
          SLACK_COLOR: 'danger'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

